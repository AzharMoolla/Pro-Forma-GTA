# Daily: fetch fresh public planning data, verify it, pack it for the map, build and deploy plangta.ca.
# If any step fails, nothing is deployed and the last good version stays live.
name: Refresh map data and deploy
on:
  schedule:
    - cron: '0 9 * * *' # 05:00 Toronto (EDT), after the City's daily refresh of development applications
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Collect public data (fresh downloads)
        run: |
          npm run map:collect -- --refresh
          npm run map:collect:regional -- --refresh
      - name: Verify counts and hashes
        run: npm run map:verify
      - name: Pack the map for static hosting
        run: npm run map:pack
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy (only changed files upload)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Keep the free Supabase project active (a read the database answers; no data returned)
        if: always()
        run: curl -s -o /dev/null -w "supabase %{http_code}\n" "$URL/rest/v1/projects?select=id&limit=1" -H "apikey: $KEY"
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
